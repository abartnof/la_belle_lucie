[package]
name = "la-belle-lucie-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "La Belle Lucie as a JSON protocol that a browser, or any other client, can drive."

[lib]
# cdylib is the WebAssembly module; rlib lets the protocol be tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
la-belle-lucie-core = { path = "../la-belle-lucie-core" }

[dev-dependencies]
serde_json = "1"
