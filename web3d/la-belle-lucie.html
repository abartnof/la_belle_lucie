<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Belle Lucie</title>
<link rel="icon" href="data:,">
<style>
/* A full-viewport canvas, and the overlay's own classes (prefix lbl-). */
html, body { margin: 0; height: 100%; overflow: hidden; background: #edeef0; }
#app { position: fixed; inset: 0; margin: 0; padding: 0; max-width: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

:root {
  /* Greyscale chrome; colour only where it means something: red is an error
     or a loss; one gentle blue is "look here, act here" (a hint, a choice, focus, the lit button). */
  --lbl-bg: #f7f7f7; --lbl-fg: #1a1a1a; --lbl-mute: #4d4d4d; --lbl-line: #8a8a8a;
  --lbl-accent: #2b2b2b; --lbl-on: #ffffff; --lbl-danger: #b3191f; --lbl-focus-blue: #0a6cf0; --lbl-focus: var(--lbl-focus-blue); --lbl-hint: var(--lbl-focus-blue);
  --lbl-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --lbl-bg: #1f1f1f; --lbl-fg: #f0f0f0; --lbl-mute: #c2c2c2; --lbl-line: #767676;
    --lbl-accent: #e6e6e6; --lbl-on: #141414; --lbl-danger: #ff9b95; --lbl-focus-blue: #4d9bff;
  }
}

.lbl-ui {
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--lbl-fg);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.lbl-ui [hidden], .lbl-dialog [hidden] { display: none !important; }
.lbl-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.lbl-hud {
  position: absolute; top: 8px; left: 8px; right: 8px; margin: 0 auto; width: max-content; max-width: calc(100% - 16px);
  display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; list-style: none; padding: 6px 12px;
  background: var(--lbl-bg); border: 1px solid var(--lbl-line); border-radius: 10px; box-shadow: var(--lbl-shadow);
  pointer-events: auto; font-variant-numeric: tabular-nums;
}
.lbl-k { color: var(--lbl-mute); }
.lbl-v { font-weight: 700; }

.lbl-bar {
  position: absolute; left: 8px; right: 8px; bottom: 8px; margin: 0 auto; width: max-content; max-width: calc(100% - 16px);
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px;
  background: var(--lbl-bg); border: 1px solid var(--lbl-line); border-radius: 12px; box-shadow: var(--lbl-shadow); pointer-events: auto;
}

.lbl-btn {
  font: inherit; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer;
  background: var(--lbl-accent); color: var(--lbl-on); border: 2px solid var(--lbl-accent); border-radius: 8px;
}
.lbl-btn.lbl-quiet { background: transparent; color: var(--lbl-fg); border-color: var(--lbl-line); }
.lbl-btn.lbl-danger { background: transparent; color: var(--lbl-danger); border-color: var(--lbl-danger); }
.lbl-btn.lbl-small { min-height: 36px; padding: 0 10px; }
.lbl-btn.lbl-wide { width: 100%; text-align: left; }
.lbl-btn:disabled { opacity: 0.55; cursor: default; }
/* The Redeal button, when it is the only move left: the focus blue, ringed. It stays
   put (no pulse): the blue already says this is what you act on. */
.lbl-btn.lbl-ready:not(:disabled) {
  background: #0a6cf0; color: #ffffff; border-color: #0a6cf0; box-shadow: 0 0 0 3px rgba(10, 108, 240, 0.35);
}
.lbl-btn:not(:disabled):hover { filter: brightness(1.08); }
.lbl-ui :focus-visible, .lbl-dialog :focus-visible { outline: 3px solid var(--lbl-focus); outline-offset: 2px; }
.lbl-link { font: inherit; background: none; border: 0; padding: 0; color: var(--lbl-accent); text-decoration: underline; cursor: pointer; }

.lbl-end {
  position: absolute; left: 8px; right: 8px; margin: 0 auto; width: min(26rem, calc(100% - 16px)); box-sizing: border-box;
  background: var(--lbl-bg); border: 1px solid var(--lbl-line); border-radius: 12px; box-shadow: var(--lbl-shadow);
  padding: 10px 14px; pointer-events: auto;
}
/* The hint floats over the table, top left, and never moves it. Compact: what
   to do, then the rule. Below the status pill on a narrow window. */
.lbl-hint {
  position: absolute; top: 8px; left: 8px; width: min(21rem, calc(100% - 16px)); box-sizing: border-box;
  background: var(--lbl-bg); border: 1px solid var(--lbl-line); border-left: 5px solid var(--lbl-hint); border-radius: 10px;
  box-shadow: var(--lbl-shadow); padding: 6px 38px 6px 10px; pointer-events: auto; font-size: 0.9rem; line-height: 1.3;
}
.lbl-hint p, .lbl-end p { margin: 0 0 6px; }
.lbl-hint p { margin: 0 0 3px; }
.lbl-hint p:last-of-type { margin: 0; }
.lbl-hint-do { font-weight: 700; }
.lbl-hint-why { color: var(--lbl-mute); font-size: 0.8rem; }
.lbl-hint .lbl-x { position: absolute; top: 2px; right: 2px; min-width: 36px; min-height: 36px; padding: 0; font-size: 1.3rem; line-height: 1; border-color: transparent; }
.lbl-end { top: 30%; text-align: center; }
.lbl-end .lbl-row { justify-content: center; }

.lbl-dialog {
  box-sizing: border-box; width: min(34rem, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; padding: 16px 18px;
  background: var(--lbl-bg); color: var(--lbl-fg); border: 1px solid var(--lbl-line); border-radius: 14px; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.lbl-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
.lbl-h { font-size: 1.2rem; margin: 0 0 8px; }
.lbl-dialog h3 { font-size: 1rem; margin: 12px 0 4px; }
.lbl-dialog p { margin: 0 0 8px; }
.lbl-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.lbl-plain { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; }
.lbl-note { color: var(--lbl-mute); font-size: 0.875rem; margin: 2px 0 0 1.6em; }
.lbl-note.lbl-bad { color: var(--lbl-danger); font-weight: 600; }
.lbl-field, .lbl-opt { margin: 0 0 10px; }
.lbl-set { border: 1px solid var(--lbl-line); border-radius: 10px; margin: 0 0 12px; padding: 8px 12px; }
.lbl-set legend { font-weight: 700; padding: 0 4px; }
.lbl-dialog input[type="checkbox"], .lbl-dialog input[type="radio"] { width: 20px; height: 20px; vertical-align: -4px; accent-color: var(--lbl-accent); }
.lbl-dialog select, .lbl-dialog input[type="text"] { font: inherit; min-height: 40px; color: var(--lbl-fg); background: var(--lbl-bg); border: 1px solid var(--lbl-line); border-radius: 6px; padding: 0 8px; }
.lbl-stepper { display: inline-flex; align-items: center; gap: 8px; }
.lbl-step { padding: 0; width: 44px; }
.lbl-count { min-width: 1.5ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.lbl-confirm { border: 2px solid var(--lbl-danger); border-radius: 10px; padding: 8px 12px; margin: 8px 0; }

@media (max-width: 480px) {
  .lbl-bar { gap: 4px; }
  .lbl-btn { padding: 0 10px; }
  .lbl-dialog { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .lbl-ui *, .lbl-dialog, .lbl-dialog * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (max-width: 899px) {
  .lbl-hint { top: 56px; }
}
@media (max-width: 480px) {
  .lbl-hint { top: 96px; }
}

.lbl-idle .lbl-hud, .lbl-idle .lbl-bar, .lbl-idle .lbl-hint, .lbl-idle .lbl-end { display: none; }
/* The one deal button of a menu or end screen: the focus blue. */
.lbl-btn.lbl-primary { background: var(--lbl-focus-blue); border-color: var(--lbl-focus-blue); color: #ffffff; }
@media (prefers-color-scheme: dark) { .lbl-btn.lbl-primary { color: #0b0b0b; } }
/* The menu's Deal and Cancel stay in view however long the options run. */
.lbl-dialog .lbl-actions { position: sticky; bottom: -16px; margin: 0 -18px -16px; padding: 10px 18px; background: var(--lbl-bg); border-top: 1px solid var(--lbl-line); }

</style>
</head>

The pack is dealt face up into **fans** of three cards, and the last fan holds one.

Only the **top** card of a fan can be moved. Moving it frees the card beneath.

Every card is face up, so you can plan ahead.

# The foundations

Each suit has a **foundation**, where cards go *home*. Start with the **ace**, then the 2, 3 and so on up to the king, in suit.

Only a top card can go home. Get all 52 home to win.

# Building

A top card can also move onto another fan's top card if it is the **same suit** and **one rank higher**. The 6\u2665 goes onto the 7\u2665.

One card moves at a time. This is how you reach the cards buried below.

# Redeal

When no other move is left, you may **redeal**. The cards not yet home are gathered and dealt again in threes. They are shuffled, unless the rules say *in order*.

The counter at the top shows how many redeals are left. Cards at home stay there.

# The draw

On the last deal, once, you may **draw** one buried card out of any fan. It must be played at once: home, or onto a top card it can build on.

# Kings fill

A fan has emptied. In this game a **king** may move into an empty fan. No other card may.
